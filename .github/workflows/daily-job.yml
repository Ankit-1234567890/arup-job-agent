name: Daily Job Agent

on:
  schedule:
    - cron: '30 2 * * *' 
  workflow_dispatch:      

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run job agent script
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python agent.py
      
      - name: Send Email with matches
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 🎯 Job Matches for Arup Pal
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: Job Agent <${{ secrets.EMAIL_ADDRESS }}>
          html_body: file://job_matches.html
